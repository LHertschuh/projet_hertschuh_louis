<div class="login-container">
  <div class="login-card">
    <h2>Se connecter</h2>
    
    <div class="error-message" *ngIf="errorMessage">{{ errorMessage }}</div>
    <div class="success-message" *ngIf="successMessage">{{ successMessage }}</div>
    
    <form class="login-form" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="email">Email</label>
        <input [(ngModel)]="email" type="email" id="email" name="email" placeholder="votre@email.com" required>
      </div>
      
      <div class="form-group">
        <label for="password">Mot de passe</label>
        <input [(ngModel)]="password" type="password" id="password" name="password" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn-submit">Se connecter</button>
    </form>
    
    <p class="signup-link">Pas encore de compte ? <a routerLink="/signup">S'inscrire</a></p>
  </div>
</div>
